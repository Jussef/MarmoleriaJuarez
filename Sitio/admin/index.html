<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Terramiz</title>
  <script>
    // Las rutas del panel son relativas: /admin debe terminar en "/" para que carguen estilos y scripts
    if (/\/admin$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <meta name="theme-color" content="#1f2922">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/popup.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23a8844a' d='M20 2l8 8-8 8-8-8z'/%3E%3Cpath fill='%23d8d2c4' d='M10 12l8 8-8 8-8-8z'/%3E%3Cpath fill='%235a5446' d='M30 12l8 8-8 8-8-8z'/%3E%3Cpath fill='%237d8a72' d='M20 22l8 8-8 8-8-8z'/%3E%3C/svg%3E">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section class="login" id="login" hidden>
    <div class="login__card">
      <svg class="login__mark" viewBox="0 0 40 40" aria-hidden="true">
        <path fill="#a8844a" d="M20 2l8 8-8 8-8-8z"/>
        <path fill="#d8d2c4" d="M10 12l8 8-8 8-8-8z"/>
        <path fill="#5a5446" d="M30 12l8 8-8 8-8-8z"/>
        <path fill="#7d8a72" d="M20 22l8 8-8 8-8-8z"/>
      </svg>
      <h1 class="login__name">Terramiz</h1>
      <p class="login__sub">Panel de administración</p>

      <form class="login__form" id="loginForm">
        <label class="field">
          <span>Usuario</span>
          <input type="text" value="admin@terramiz.com" autocomplete="username" disabled>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" value="demo-demo" autocomplete="current-password" disabled>
        </label>
        <button class="btn btn--gold btn--block" type="submit" autofocus>Entrar</button>
      </form>
      <p class="login__note">Versión demo: el acceso aún no pide contraseña.</p>
      <a class="login__back" href="../">← Volver al sitio</a>
    </div>
  </section>

  <!-- ============ PANEL ============ -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a class="side__logo" href="#resumen">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path fill="#a8844a" d="M20 2l8 8-8 8-8-8z"/>
          <path fill="#d8d2c4" d="M10 12l8 8-8 8-8-8z"/>
          <path fill="#5a5446" d="M30 12l8 8-8 8-8-8z"/>
          <path fill="#7d8a72" d="M20 22l8 8-8 8-8-8z"/>
        </svg>
        <span>Terramiz<small>Panel</small></span>
      </a>

      <nav class="side__nav" aria-label="Secciones del panel">
        <a href="#resumen" data-route="resumen"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Resumen</a>
        <a href="#banner" data-route="banner"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.5"/></svg>Banner principal</a>
        <a href="#contenido" data-route="contenido"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Textos e imágenes</a>
        <a href="#popups" data-route="popups"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Popups y promociones</a>
        <a href="#mensajes" data-route="mensajes"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>Mensajes <b class="side__badge" id="unreadBadge" hidden></b></a>
        <a href="#ajustes" data-route="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</a>
      </nav>

      <div class="side__foot">
        <a href="../" target="_blank" rel="noopener" class="side__link"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Ver sitio</a>
        <button type="button" class="side__link" id="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="top__burger" id="menuBtn" aria-label="Abrir menú" aria-controls="side" aria-expanded="false"><span></span><span></span><span></span></button>
        <div>
          <h1 class="top__title" id="pageTitle">Resumen</h1>
          <p class="top__sub" id="pageSub"></p>
        </div>
        <div class="top__user">
          <span class="top__avatar" aria-hidden="true">T</span>
          <span class="top__who">Hola, <strong>Terramiz</strong></span>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
